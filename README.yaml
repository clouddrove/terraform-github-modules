---
# Project metadata for this repository.
#
# NOTE: this file is reference metadata only. `make docs` runs terraform-docs,
# which injects the inputs and outputs tables between the BEGIN_TF_DOCS and
# END_TF_DOCS markers in README.md and does not read this file. The prose above
# those markers in README.md is maintained by hand. Keep the two in step, or
# wire a generator into the docs target if you want one source of truth.

name: Terraform GitHub Modules

license: "APACHE"

github_repo: clouddrove/terraform-github-modules

badges:
  - name: "Latest Release"
    image: "https://img.shields.io/github/release/clouddrove/terraform-github-modules.svg"
    url: "https://github.com/clouddrove/terraform-github-modules/releases/latest"
  - name: "Licence"
    image: "https://img.shields.io/badge/License-APACHE-blue.svg"
    url: "LICENSE"

prerequesties:
  - name: Terraform 1.10.0
    url: https://developer.hashicorp.com/terraform/install

description: |-
  Terraform modules to manage GitHub organizations, repositories, rulesets,
  teams, environments, Actions configuration, and secrets. Includes a secrets
  module that publishes credentials produced by other Terraform modules, such
  as an AWS RDS password or an Azure Key Vault secret, into GitHub Actions,
  Dependabot, and Codespaces secrets.

include:
  - "terraform.md"
