#  description of this project
description: |-
  Terraform modules to manage GitHub organizations, repositories, rulesets, teams,
  environments, Actions configuration, and secrets.

  The suite includes a secrets module that publishes credentials produced by other
  Terraform modules, such as an AWS RDS master password or an Azure Key Vault
  secret, into GitHub Actions, Dependabot, and Codespaces secrets at repository,
  organization, or environment scope.

  IMPORTANT: secret values are recorded in Terraform state in clear text. This is
  inherent to the GitHub provider API and no module can change it. Use remote state
  encrypted with a customer-managed key and restrict read access to it. For cloud
  provider access, prefer OIDC federation over stored credentials; see the actions
  submodule.

# How to use this project
usage: |-
  Here are some examples of how you can use this module in your inventory structure:

  ### basic example
  ```hcl
      module "github" {
        source      = "clouddrove/modules/github"
        version     = "0.0.1"
        name        = "api"
        environment = "prod"
        description = "API service"
        visibility  = "private"
        topics      = ["terraform", "api"]

        ruleset = {
          ruleset_name = "main-protection"
          rules = {
            deletion         = true
            non_fast_forward = true
            pull_request = {
              required_approving_review_count = 2
            }
          }
        }
      }
  ```

  ### secrets from a module output
  ```hcl
      module "github_secrets" {
        source  = "clouddrove/modules/github//modules/secrets"
        version = "0.0.2"

        secrets = {
          RDS_PASSWORD = { value = module.rds.master_password }
          DB_HOST      = { value = module.rds.endpoint, as_variable = true }
        }

        kinds   = ["actions", "dependabot"]
        targets = { repositories = ["api"] }
      }
  ```

  ### secrets pulled from AWS Secrets Manager and Azure Key Vault
  ```hcl
      module "aws_secrets" {
        source  = "clouddrove/modules/github//modules/secrets-source-aws"
        version = "0.0.2"

        secrets = {
          STRIPE_KEY = { arn = "arn:aws:secretsmanager:eu-west-1:1234:secret:app/stripe", json_key = "api_key" }
          DD_API_KEY = { ssm_parameter = "/prod/datadog/api_key" }
        }
      }

      module "github_secrets" {
        source  = "clouddrove/modules/github//modules/secrets"
        version = "0.0.2"

        secrets = merge(
          module.aws_secrets.values,
          {
            SERVICE_TOKEN = { generate = { length = 40, special = false, rotation_days = 90 } }
          }
        )

        targets = {
          repositories = ["api", "worker"]
          environments = [{ repository = "api", environment = "prod" }]
        }
      }
  ```
