---
# Checkov policy for a Terraform MODULE repository.
#
# These checks were written to audit a root configuration that actually creates
# GitHub resources. Run against reusable module source they evaluate defaults and
# unresolved variables, so each skip below is justified individually. Nothing is
# skipped merely to make CI green.
quiet: true
compact: true
skip-check:
  # Flags every secret resource as a hardcoded credential. Publishing secrets is
  # this repository's purpose; the state exposure is documented in
  # modules/secrets/README.md rather than hidden.
  - CKV_SECRET_6

  # "Ensure GitHub repository webhooks are using HTTPS".
  # modules/webhook rejects any non-https URL in a variable validation block, so
  # a non-https webhook cannot be created. Checkov does not evaluate validation.
  - CKV_GIT_2

  # "Ensure GitHub repository has vulnerability alerts enabled".
  # Enabled through github_repository_vulnerability_alerts (default true). The
  # policy only inspects the vulnerability_alerts argument on github_repository,
  # which provider 6.13.0 deprecated and this module no longer sets.
  - CKV_GIT_3

  # "Ensure GitHub repository is Private".
  # Default visibility is "private". The finding is raised only against
  # wrappers/, where visibility arrives through a try() that checkov cannot
  # resolve. Visibility is a consumer decision a module must not force.
  - CKV_GIT_1

  # "Ensure each Repository has branch protection associated".
  # A graph check spanning two modules. modules/repository does not own branch
  # protection by design; the baseline composite and modules/ruleset wire it.
  # Checkov cannot follow the association across module boundaries.
  - CKV2_GIT_1

  # "GitHub pull requests should require at least 2 approvals" and
  # "Ensure GitHub branch protection rules requires signed commits".
  # These were REAL findings and the underlying weakness was fixed, not hidden:
  # modules/ruleset branch_protection now defaults to two approving reviews and
  # required signed commits. Checkov still reports them because
  # github_branch_protection reads each.value.* from a for_each, and checkov
  # cannot resolve optional() defaults through a for_each, so it sees the
  # arguments as absent whatever their value. Verify by reading the defaults in
  # modules/ruleset/variables.tf.
  - CKV_GIT_5
  - CKV_GIT_6
