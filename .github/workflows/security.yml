---
# Calls the shared reusable security workflows in
# clouddrove/github-shared-workflows/.github/workflows/
# Workflow file names and input names verified against that repository
# (default branch: master).
#
# security-tfsec.yml is intentionally not called here: it declares a required
# secret named GITHUB (a personal access token) that this repository does not
# provide. tfsec runs locally through `make security` and the .tfsec/config.yml
# exclusions instead.
name: security

on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
  checkov:
    uses: clouddrove/github-shared-workflows/.github/workflows/security-checkov.yml@master
    with:
      directory: '.'
      continue_on_error: 'true'
      skip_check: 'CKV_SECRET_6'

  gitleaks:
    uses: clouddrove/github-shared-workflows/.github/workflows/pr-gitleaks-scan.yml@master
